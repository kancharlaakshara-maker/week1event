<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
        }
        p {
            color: #666666;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444444;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            border-color: #4A90E2;
            outline: none;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #444444;
        }
        .radio-option input {
            margin-right: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4A90E2;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Event Registration</h2>
    <p>Secure your spot by filling out the form below.</p>
    
    <form action="#" method="POST">
        <!-- Full Name -->
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

        <!-- Ticket Type Selection -->
        <div class="form-group">
            <label for="ticket">Ticket Type</label>
            <select id="ticket" name="ticket" required>
                <option value="" disabled selected>Select your ticket</option>
                <option value="general">General Admission</option>
                <option value="vip">VIP Pass</option>
                <option value="student">Student Discount</option>
            </select>
        </div>

        <!-- Dietary Preference Selection -->
        <div class="form-group">
            <label>Dietary Requirement</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="diet" value="none" checked> None
                </label>
                <label class="radio-option">
                    <input type="radio" name="diet" value="vegetarian"> Vegetarian
                </label>
                <label class="radio-option">
                    <input type="radio" name="diet" value="vegan"> Vegan
                </label>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit">Register Now</button>
    </form>
</div>

</body>
</html>
